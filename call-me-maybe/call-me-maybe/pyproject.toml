[project]
name = "call-me-maybe"
version = "1.5.0"
description = "Function calling for LLMs via constrained decoding (42 project)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.24",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "flake8>=7.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
exclude = [".venv", "llm_sdk", "__pycache__"]
