[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calls with constrained decoding"
authors = [{name = "oel-mora"}]
requires-python = ">=3.10,<3.13"
dependencies = [
    "llm-sdk",
    "numpy>=1.26,<2",
    "pydantic>=2.11,<3",
    "accelerate>=1,<2",
]

[dependency-groups]
dev = ["flake8>=7,<8", "mypy==1.15.0"]

[tool.uv]
constraint-dependencies = ["torch==2.5.1", "transformers==4.57.6"]

[tool.uv.sources]
llm-sdk = {path = "llm_sdk"}

[tool.mypy]
exclude = ["^llm_sdk/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
