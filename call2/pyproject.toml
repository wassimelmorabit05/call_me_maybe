[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small language model"
requires-python = ">=3.10"

dependencies = [
    "llm-sdk",
    "pydantic>=2.0",
    "numpy<2",
    "pathlib>=1.0.1",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
mypy_path = ["llm_sdk"]
